[project]
name = "agent-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "web3>=7,<8",
  "eth-account>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "eth-abi>=4,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
