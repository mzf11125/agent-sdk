[package]
name = "agent-sdk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-core = { version = "0.8", default-features = false, features = ["sol-types"] }
alloy-primitives = { version = "0.8", default-features = false }

[dev-dependencies]
# For integration tests: use alloy provider + transport for proper RPC client with signing.
# Pin a compatible alloy version — if conflicts arise, prefer consistency across all alloy deps.
alloy = { version = "0.11", features = ["full"] }
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["std"]
std = []
